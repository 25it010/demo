<!DOCTYPE html>
<html>

<head>

    <title>Student Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header>

    <div class="logo">
        🎓 Student Hub
    </div>

    <div class="academic-year">
        Academic Year: 2026 - 2027
    </div>

</header>


<section class="hero">

    <h1>
        STUDENT LOGIN
    </h1>

    <p>
        Login To Your Student Hub Account
    </p>

</section>


<section class="auth-section">

    <div class="auth-grid">


        <div class="auth-card">

            <h2>
                Login
            </h2>

            <form action="dashboard.html">

                <div class="form-group">

                    <label>
                        Email / Username:
                    </label>

                    <input type="text" required>

                </div>


                <div class="form-group">

                    <label>
                        Password:
                    </label>

                    <input type="password" required>

                </div>


                <p>
                    Forgot Password?
                </p>

                <br>

                <div class="buttons">

                    <button type="submit" class="btn">
                        Login
                    </button>

                </div>

            </form>

        </div>


        <div class="auth-card">

            <h2>
                New Student?
            </h2>

            <p>
                Don't have an account?
                Register yourself to access
                the Student Hub Portal.
            </p>

            <br>

            <div class="buttons">

                <a href="register.html" class="btn">
                    Register
                </a>

            </div>

        </div>


    </div>

</section>


<footer>

    <strong>
        Student Hub Portal
    </strong>

    <p>
        © 2026 Student Hub Portal
    </p>

</footer>


</body>
</html>
