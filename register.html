<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


<header>

    <div class="logo">
        🎓 Student Hub
    </div>

    <div class="academic-year">
        Academic Year: 2026 - 2027
    </div>

</header>


<section class="hero">

    <h1>
        STUDENT REGISTRATION
    </h1>

    <p>
        Create Your Student Hub Account
    </p>

</section>


<section class="auth-section">

    <div class="auth-grid">


        <div class="auth-card">

            <h2>
                Register
            </h2>

            <form action="login.html">

                <div class="form-group">

                    <label>
                        Username:
                    </label>

                    <input type="text" required>

                </div>


                <div class="form-group">

                    <label>
                        Email / Phone:
                    </label>

                    <input type="text" required>

                </div>


                <div class="form-group">

                    <label>
                        Password:
                    </label>

                    <input type="password" required>

                </div>


                <div class="form-group">

                    <label>
                        Confirm Password:
                    </label>

                    <input type="password" required>

                </div>


                <div class="buttons">

                    <button type="submit" class="btn">
                        Register
                    </button>

                </div>

            </form>

        </div>


        <div class="auth-card">

            <h2>
                Already Have Account?
            </h2>

            <p>
                Already have an account?
                Login to access your Student Hub.
            </p>

            <br>

            <div class="buttons">

                <a href="login.html" class="btn">
                    Login
                </a>

            </div>

        </div>


    </div>

</section>


<footer>

    <strong>
        Student Hub Portal
    </strong>

    <p>
        © 2026 Student Hub Portal
    </p>

</footer>


</body>
</html>
